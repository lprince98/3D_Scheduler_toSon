<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙제 플래너</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #2b2925; color: #fff; font: 18px/1.5 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: max(40px, env(safe-area-inset-top)) 20px 40px; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  a.app { display: flex; align-items: center; gap: 18px; background: #f4efe4; color: #1f1d1a; text-decoration: none; border-radius: 20px; padding: 20px; margin-bottom: 16px; min-height: 72px; }
  a.app img { width: 72px; height: 72px; border-radius: 16px; }
  a.app b { display: block; font-size: 22px; }
  a.app small { color: #6b665d; }
  p.hint { color: rgba(255,255,255,.7); font-size: 15px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>숙제 플래너</h1>
  <a class="app" href="./tank/"><img src="./tank/icon-192.png" alt=""><span><b>전차 조립 플래너</b><small>숙제 하나 = 부품 하나. 한 달에 전차 한 대</small></span></a>
  <a class="app" href="./monster/"><img src="./monster/icon-192.png" alt=""><span><b>몬스터 플래너</b><small>숙제로 키우는 3D 몬스터</small></span></a>
  <a class="app" href="./dinosaurus/"><img src="./dinosaurus/icon-192.png" alt=""><span><b>공룡 뼈 조립</b><small>할 일 하나 = 뼈 하나. 동생용 3D 공룡</small></span></a>
  <p class="hint">태블릿에서는 원하는 앱을 연 뒤 크롬 메뉴 ⋮ → "홈 화면에 추가"를 하면 앱처럼 열립니다. 세 앱의 저장은 서로 별도입니다.</p>
</main>
</body>
</html>
