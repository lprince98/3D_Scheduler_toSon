<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6E6C4">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>공룡 뼈 조립</title>
<style>
  :root { --bg: #F6E6C4; --ink: #4a3b2a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { font-family: inherit; cursor: pointer; }
  #app { position: fixed; inset: 0; }
  #stage { position: absolute; inset: 0; }

  /* 오늘 할 일 카드: 가로 = 오른쪽 세로줄, 세로 = 아래 가로줄 */
  #side { position: absolute; right: 0; top: 0; bottom: 0; z-index: 3; width: calc(clamp(220px, 23vw, 300px) + env(safe-area-inset-right));
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
    padding: 16px calc(18px + env(safe-area-inset-right)) 16px 0; }
  .card { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #FFFBF2; border-radius: 30px; padding: 12px 14px 12px 12px; box-shadow: 0 5px 0 rgba(120,90,50,.18); }
  /* 카드 수(--n, 최대 5)에 맞춰 크기를 줄임: 가로 = 화면 높이, 세로 = 화면 폭 기준 */
  #side { --n: 3; --ic: clamp(56px, calc((100vh - 32px - (var(--n) - 1) * 18px) / var(--n) - 26px), 104px); --go: calc(var(--ic) * .81); }
  .card .ic { width: var(--ic); height: var(--ic); border-radius: 24px; display: grid; place-items: center; flex: 0 0 auto; }
  .card .ic svg { width: 80%; height: 80%; }
  .card .go { width: var(--go); height: var(--go); border-radius: 50%; border: none; background: #3f9a4a; box-shadow: 0 6px 0 #2b7334;
    display: grid; place-items: center; padding: 0; flex: 0 0 auto; }
  .card .go svg { width: 58%; height: 58%; margin-left: 6px; }
  .card .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b7334; }
  .card.done { background: #F3EEE3; }
  .card.done .ic { opacity: .55; }
  .card .stamp { width: var(--go); height: var(--go); transform: rotate(-14deg); animation: stampIn .5s ease-out; }
  @keyframes stampIn { 0% { transform: scale(2) rotate(-14deg); opacity: 0; } 100% { transform: scale(1) rotate(-14deg); opacity: 1; } }
  .card.bump { animation: bump .35s; }
  @keyframes bump { 40% { transform: scale(.95); } }
  .card.rest, .card.empty { justify-content: center; }
  .card.empty .ic { border: 4px dashed #d9c8a8; }
  .phint { font-size: 14px; color: #8a7760; text-align: center; margin: 0; }
  .card .go.wait { background: #FFD54A; box-shadow: 0 6px 0 #D9A900; animation: pulse 1.4s ease-in-out infinite; }
  .card .go.wait svg { margin-left: 0; width: 70%; height: 70%; }
  body.busy .card .go { background: #b9b2a5; box-shadow: 0 6px 0 #9a9385; }
  body.cheer #side .card.done .stamp { animation: stampIn .5s ease-out; }
  @media (orientation: portrait) {
    #side { left: 0; top: auto; width: auto; flex-direction: row; justify-content: center; gap: 14px;
      padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
    #side { --ic: clamp(56px, calc((100vw - 32px - (var(--n) - 1) * 14px) / var(--n) - 28px), 104px); }
    #side .card { flex: 1 1 0; min-width: 0; max-width: 230px; flex-direction: column; padding: 14px; gap: 12px; }
    .phint { align-self: center; max-width: 240px; }
  }

  /* 하는 중 화면 */
  #doing { position: fixed; inset: 0; z-index: 15; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; }
  #doing.on { display: flex; }
  #dIcon { width: min(300px, 60vw, 38vh); height: min(300px, 60vw, 38vh); background: #FFFBF2; border-radius: 48px; display: grid; place-items: center;
    box-shadow: 0 8px 0 rgba(120,90,50,.15); }
  #dIcon svg { width: 78%; height: 78%; }
  #doing .round { border: none; border-radius: 50%; display: grid; place-items: center; padding: 0; }
  #doing .round svg { width: 60%; height: 60%; }
  #dSpeak { width: 76px; height: 76px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  .drow { display: flex; align-items: center; gap: 48px; }
  #dLater { width: 88px; height: 88px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  #dDone { width: 150px; height: 150px; background: #FFD54A; box-shadow: 0 8px 0 #D9A900; }
  #dDone:active, #dLater:active, #dSpeak:active { transform: translateY(4px); }

  /* 잠자기 */
  #night { position: absolute; inset: 0; background: rgba(30,30,80,.28); pointer-events: none; opacity: 0; transition: opacity 1.5s; }
  body.sleep #night { opacity: 1; }
  #zzz { position: fixed; left: 0; top: 0; pointer-events: none; display: none; z-index: 4; }
  body.sleep #zzz { display: block; }
  #zzz svg { width: 90px; height: 90px; animation: zfloat 3s ease-in-out infinite; }
  @keyframes zfloat { 0% { transform: translateY(10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* 뼈 칸 (숫자·글자 없음) */
  #bar {
    position: absolute; left: 50%; z-index: 2; bottom: calc(14px + env(safe-area-inset-bottom));   /* left·bottom은 JS가 빈 공간 기준으로 맞춤 */
    transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px 14px;
    background: rgba(255,255,255,.55); border-radius: 26px; pointer-events: none;
  }
  .slot { width: 60px; height: 60px; }
  .slot svg { width: 100%; height: 100%; overflow: visible; }
  .slot path { fill: none; stroke: #b39a74; stroke-width: 3; stroke-dasharray: 5 5; }
  .slot.on path { fill: #FFF8E6; stroke: #7c6040; stroke-dasharray: none; }
  .slot.next path { stroke: #F2A900; }
  .slot.pop { animation: pop .55s; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
  body.awake #bar { background: rgba(255,255,255,.7); }
  body.awake .slot.on path { fill: #FFE08A; }
  /* 자라기 칸: 작은 공룡 → 큰 공룡 (글자 없음) */
  #bar .grow { display: none; align-items: flex-end; gap: 10px; height: 60px; }
  body.growing #bar .slot { display: none; }
  body.growing #bar .grow { display: flex; }
  .gs { width: calc(72px * var(--s)); height: calc(60px * var(--s)); }
  .gs svg { width: 100%; height: 100%; display: block; }
  .gs:not(.on) { opacity: .55; }
  .gs.pop { animation: pop .7s; }

  /* 손가락 안내 */
  #hand { position: fixed; left: 0; top: 0; width: 96px; height: 96px; margin: -6px 0 0 -31px;
    pointer-events: none; display: none; z-index: 5; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  #hand.on { display: block; }
  #hand.tap svg { animation: tapx .6s ease-in-out infinite; }
  @keyframes tapx { 0%,100% { transform: translate(0,-14px); } 50% { transform: translate(0,0) scale(.92); } }

  /* 부모 테스트 패널 입구: 왼쪽 위 모서리 3초 길게 누르기 */
  /* 부모 모드 버튼: 누르면 비밀번호 화면 (아이는 비밀번호에서 막힘) */
  #corner { position: absolute; left: calc(14px + env(safe-area-inset-left)); top: calc(14px + env(safe-area-inset-top)); z-index: 10;
    width: 64px; height: 64px; border-radius: 50%; border: none; background: rgba(255,255,255,.85); box-shadow: 0 4px 0 rgba(0,0,0,.12);
    display: grid; place-items: center; padding: 14px; }
  #corner svg { width: 100%; height: 100%; }
  #corner:active { transform: translateY(3px); }

  #stats { position: absolute; left: 10px; top: 10px; margin-left: 110px; background: rgba(0,0,0,.55); color: #fff;
    font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: pre; }
  #stats.warn { background: rgba(200,40,40,.75); }
  #stats.hidden { display: none; }

  /* 발자국 타이머 (숫자 없음) */
  #trow { display: flex; align-items: center; gap: 18px; }
  #doing.notimer #trow { display: none; }
  #feet { display: flex; gap: 4px; align-items: center; }
  #feet .fp { width: 44px; height: 44px; transform: rotate(90deg) translateX(-6px); transition: opacity .6s, transform .6s; }
  #feet .fp.dn { transform: rotate(90deg) translateX(6px); }
  #feet .fp svg { width: 100%; height: 100%; }
  #feet .fp.gone { opacity: .12; }
  #doing.paused #feet { opacity: .5; }
  #dPause { width: 64px; height: 64px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  #dWave { position: absolute; right: 6%; bottom: 8%; width: 170px; display: none; }
  #doing.ring #dWave { display: block; animation: hop 1s ease-in-out infinite; }
  #doing.ring #dDone { animation: pulse .8s ease-in-out infinite; }
  #doing.ring #trow { display: none; }
  @keyframes hop { 50% { transform: translateY(-16px); } }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  .dino2d .arm { transform-origin: 70px 58px; animation: waveArm .5s ease-in-out infinite alternate; }
  @keyframes waveArm { from { transform: rotate(-30deg); } to { transform: rotate(25deg); } }

  /* 부모 확인 도장 */
  #stamp { position: fixed; inset: 0; z-index: 16; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #FFF4DA; padding: 20px; }
  #stamp.on { display: flex; }
  #stamp .who { display: flex; align-items: center; gap: 24px; }
  #stamp .who .ic { width: 140px; height: 140px; border-radius: 32px; background: #fff; display: grid; place-items: center; }
  #stamp .who .ic svg { width: 78%; height: 78%; }
  #stamp .who .d { width: 180px; }
  #sq { font: 700 30px/1.2 system-ui, sans-serif; color: #6b5536; min-height: 36px; letter-spacing: 1px; }
  #sq small { display: block; font-size: 14px; font-weight: 400; color: #8a7760; text-align: center; letter-spacing: 0; }
  .keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
  .keypad button { height: 60px; border-radius: 16px; border: 1px solid #d8c9ad; background: #fff; font-size: 24px; color: var(--ink); }
  #sLater { width: 72px; height: 72px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); display: grid; place-items: center; }
  #sLater svg { width: 60%; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* 비밀번호 */
  #pin { position: fixed; inset: 0; z-index: 30; background: rgba(40,30,20,.6); display: none; align-items: center; justify-content: center; }
  #pin.on { display: flex; }
  #pin .box { background: #fffdf7; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #pin h2 { margin: 0; font-size: 20px; }
  #pinDots { display: flex; gap: 12px; }
  #pinDots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #6b5536; }
  #pinDots i.f { background: #6b5536; }
  #pinMsg { font-size: 14px; color: #a0522d; min-height: 18px; }

  /* 부모 모드 */
  #parent { position: fixed; inset: 0; z-index: 25; background: #FBF7EE; display: none; flex-direction: column; }
  #parent.on { display: flex; }
  .pbar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: #fffdf7; border-bottom: 1px solid #eadfca; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  #parent button { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d8c9ad; background: #fff; font-size: 16px; color: var(--ink); }
  #pApps { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d8c9ad; background: #fff; font-size: 16px; color: var(--ink);
    display: inline-flex; align-items: center; text-decoration: none; }
  #parent button.sel, .tabs button.on { background: #6b5536; color: #fff; border-color: #6b5536; }
  #parent button.pri { background: #3f9a4a; color: #fff; border-color: #3f9a4a; }
  #parent button.warn { background: #fff0ec; color: #b23b1e; border-color: #e8b5a8; }
  #parent button:disabled { opacity: .4; }
  #parent button.sm { min-height: 40px; padding: 0 10px; font-size: 15px; }
  .pbody { flex: 1; overflow: auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); touch-action: pan-y; -webkit-user-select: text; user-select: text; }
  .pbody h3 { margin: 18px 0 6px; font-size: 17px; color: #6b5536; }
  .pbody h3:first-child { margin-top: 0; }
  .note { font-size: 14px; color: #7a6a55; margin: 4px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .out { white-space: pre-wrap; background: #f4eee2; padding: 10px; border-radius: 10px; font-size: 14px; min-height: 24px; margin: 6px 0; }
  .days { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .day { background: #fff; border: 1px solid #eadfca; border-radius: 14px; padding: 10px; }
  .day.today { border-color: #3f9a4a; box-shadow: 0 0 0 2px #3f9a4a33; }
  .day header { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 700; margin-bottom: 6px; }
  .tag { font-size: 12px; font-weight: 400; padding: 2px 8px; border-radius: 10px; background: #efe7d6; color: #6b5536; }
  .tag.own { background: #fde7c7; color: #8a4b00; }
  .item { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 0; border-top: 1px dashed #eadfca; }
  .item .mini svg, .mini svg { width: 32px; height: 32px; display: block; }
  .item .nm { flex: 1; min-width: 80px; }
  .item .done { color: #3f9a4a; font-weight: 700; }
  .pitem { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-top: 1px dashed #eadfca; }
  .pitem .nm { flex: 1; min-width: 100px; } .pitem .ok { color: #3f9a4a; font-weight: 700; } .pitem .no { color: #a89880; }
  .step { display: inline-flex; align-items: center; gap: 4px; }
  .step b { min-width: 44px; text-align: center; font-weight: 600; }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .picker button { display: inline-flex; align-items: center; gap: 4px; }
  .subjrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #fff; border: 1px solid #eadfca; border-radius: 14px; padding: 10px; margin: 8px 0; }
  .subjrow input[type=text] { font-size: 17px; padding: 10px; border-radius: 10px; border: 1px solid #d8c9ad; width: 150px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #d8c9ad; padding: 0 !important; min-height: 0 !important; }
  .sw.on { box-shadow: 0 0 0 3px #6b5536; }
  .icpick button { padding: 4px !important; min-height: 44px !important; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding: 8px 0; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 12px; color: #7a6a55; }
  .bars span { width: 100%; background: #9CD27C; border-radius: 6px 6px 0 0; min-height: 2px; }
  table.grid { border-collapse: collapse; font-size: 14px; }
  table.grid td, table.grid th { border: 1px solid #eadfca; padding: 6px 10px; text-align: center; }
  textarea { width: 100%; min-height: 160px; font: 13px ui-monospace, monospace; border-radius: 10px; border: 1px solid #d8c9ad; padding: 8px; }

  /* 공룡 공원 버튼·보기 */
  #parkBtn { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; z-index: 4; width: 76px; height: 76px; border-radius: 50%;
    border: none; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); display: grid; place-items: center; padding: 8px; }
  #parkBtn svg { width: 100%; height: 100%; }
  #appsBtn { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 108px; z-index: 4; width: 76px; height: 76px; border-radius: 50%;
    background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); display: grid; place-items: center; padding: 14px; }
  #appsBtn svg { width: 100%; height: 100%; }
  body.busy #parkBtn, body.decoOn #parkBtn, body.viewing #parkBtn, body.busy #appsBtn, body.decoOn #appsBtn, body.viewing #appsBtn { display: none; }
  #viewBack { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; z-index: 4; width: 84px; height: 84px; border-radius: 50%;
    border: none; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); display: none; place-items: center; }
  #viewBack svg { width: 60%; }
  body.viewing #viewBack { display: grid; }
  body.viewing #side, body.viewing #bar, body.decoOn #side, body.decoOn #bar { display: none; }

  /* 고르기 화면 (공룡·이름) */
  #pick { position: fixed; inset: 0; z-index: 17; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    background: #F6E6C4; padding: 20px; }
  #pick.on { display: flex; }
  #pick.names { background: #FFF4DA; }
  #pkCards { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 1000px; }
  .pkc { border: none; border-radius: 28px; background: #fff; padding: 10px; box-shadow: 0 6px 0 rgba(120,90,50,.18); transition: transform .2s; }
  #pick.dinos .pkc { position: relative; width: min(240px, 27vw); }
  @media (orientation: portrait) { #pick.dinos .pkc { width: min(300px, 42vw); } }
  #pick.dinos .got { position: absolute; right: 6px; top: 6px; width: 46px; height: 46px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  #pick.dinos .got svg { width: 100%; height: 100%; }
  #pick.dinos .pkc img { width: 100%; border-radius: 20px; display: block; }
  #pick.names .pkc { width: 140px; height: 140px; display: grid; place-items: center; }
  #pick.names .pkc svg { width: 70%; height: 70%; }
  .pkc.sel { transform: scale(1.08); box-shadow: 0 0 0 6px #3f9a4a, 0 6px 0 rgba(120,90,50,.18); }
  #pkOk { width: 130px; height: 130px; border-radius: 50%; border: none; background: #7ED36B; box-shadow: 0 8px 0 #4e9a3e; display: grid; place-items: center; visibility: hidden; }
  #pkOk svg { width: 58%; } #pkOk path { stroke: #fff; }
  #pkOk.on { visibility: visible; animation: pulse 1.2s ease-in-out infinite; }

  /* 꾸미기 (공룡은 3D로 보이고 옆/아래에 색 고르기) */
  #deco { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; width: calc(clamp(260px, 30vw, 380px) + env(safe-area-inset-right)); display: none;
    flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: 16px calc(16px + env(safe-area-inset-right)) 16px 0; }
  body.decoOn #deco { display: flex; }
  .drow2 { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; background: rgba(255,255,255,.7); border-radius: 24px; padding: 12px; }
  .dsw { width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.12); padding: 0; }
  .dsw.sm { width: 46px; height: 46px; }
  .dsw.on { box-shadow: 0 0 0 4px #6b5536; transform: scale(1.1); }
  .dpat { width: 70px; height: 70px; border-radius: 50%; border: none; background: none; padding: 0; }
  .dpat svg { width: 100%; height: 100%; }
  .dpat.on { box-shadow: 0 0 0 4px #6b5536; }
  .dok { width: 110px; height: 110px; border-radius: 50%; border: none; background: #7ED36B; box-shadow: 0 7px 0 #4e9a3e; display: grid; place-items: center; }
  .dok svg { width: 58%; } .dok path { stroke: #fff; }
  @media (orientation: portrait) {
    #deco { left: 0; top: auto; width: auto; padding: 0 16px calc(18px + env(safe-area-inset-bottom)); flex-direction: row; flex-wrap: wrap; gap: 10px; }
    .drow2 { padding: 8px; gap: 8px; }
    .dsw { width: 48px; height: 48px; } .dsw.sm { width: 40px; height: 40px; } .dpat { width: 56px; height: 56px; }
    .dok { width: 92px; height: 92px; }
  }

  /* 공룡 공원 */
  #park { position: fixed; inset: 0; z-index: 17; display: none; flex-direction: column; align-items: center; gap: 16px; background: #D9F0CF;
    padding: calc(20px + env(safe-area-inset-top)) 20px 24px; overflow: auto; }
  #park.on { display: flex; }
  #stickers { display: flex; gap: 8px; background: rgba(255,255,255,.7); border-radius: 24px; padding: 8px 14px; }
  .stk { width: 48px; height: 48px; } .stk svg { width: 100%; height: 100%; }

  #parkGrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 1100px; }
  .pc { position: relative; width: 220px; border: none; border-radius: 24px; background: #fff; padding: 8px; box-shadow: 0 6px 0 rgba(60,100,50,.18); }

  .pc.unknown b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; color: #9dbb8e; }
  .prow { display: flex; gap: 30px; align-items: center; }
  #parkHome, #parkView { width: 88px; height: 88px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); display: grid; place-items: center; }
  #parkHome svg { width: 60%; }
  #parkView { width: 110px; height: 110px; background: #3f9a4a; box-shadow: 0 7px 0 #2b7334; visibility: hidden; }
  #parkView svg { width: 55%; margin-left: 8px; }
  #parkView.on { visibility: visible; }
</style>
